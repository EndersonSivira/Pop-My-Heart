<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pop My Heart</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }

        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 8px 32px 0 rgba(255, 105, 180, 0.2);
        }

        /* Pulse animation for high combo */
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255, 20, 147, 0.6)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(255, 20, 147, 0.9)); }
        }
        .combo-active {
            animation: pulse-glow 0.8s infinite ease-in-out;
        }

        /* Shake Flash Animation */
        @keyframes screen-flash {
            0% { opacity: 0; }
            50% { opacity: 0.3; }
            100% { opacity: 0; }
        }
        .shake-flash {
            animation: screen-flash 0.5s ease-out;
        }
    </style>
</head>
<body class="relative w-screen h-screen bg-slate-900 text-slate-800 flex flex-col justify-between overflow-hidden select-none">

    <!-- Background Image Layer -->
    <div id="bg-container" class="absolute inset-0 bg-cover bg-center bg-no-repeat transition-all duration-700 ease-in-out"
         style="background-image: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);">
        <!-- Overlay tint for readability -->
        <div class="absolute inset-0 bg-black/15 backdrop-brightness-95"></div>
    </div>

    <!-- Shake Visual Flash Effect -->
    <div id="shakeFlashOverlay" class="absolute inset-0 bg-rose-400 pointer-events-none opacity-0 z-10"></div>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas" class="absolute inset-0 z-10 cursor-pointer block w-full h-full"></canvas>

    <!-- Top Bar HUD Overlay -->
    <header class="relative z-20 p-4 sm:p-6 w-full flex justify-between items-center max-w-7xl mx-auto pointer-events-none">
        <!-- Title -->
        <div class="glass-panel px-4 sm:px-5 py-2.5 sm:py-3 rounded-2xl pointer-events-auto flex items-center gap-3 shadow-lg">
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-rose-500/20 flex items-center justify-center text-rose-600 text-lg sm:text-xl font-bold">
                <i class="fa-solid font-bold fa-heart animate-bounce"></i>
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-black text-rose-600 tracking-tight leading-none">Pop My Heart</h1>
                <p class="text-[10px] sm:text-xs font-semibold text-rose-800/80">Explotar corazones</p>
            </div>
        </div>

        <!-- Live Game Stats -->
        <div class="glass-panel px-4 sm:px-6 py-2.5 sm:py-3 rounded-2xl pointer-events-auto flex items-center gap-4 sm:gap-6 shadow-lg">
            <div class="text-center">
                <span class="block text-[10px] sm:text-xs uppercase font-bold text-rose-700/80 tracking-wider">Puntos</span>
                <span id="scoreDisplay" class="text-xl sm:text-2xl font-extrabold text-rose-600">0</span>
            </div>
            <div class="h-8 w-px bg-rose-300/40"></div>
            <div class="text-center">
                <span class="block text-[10px] sm:text-xs uppercase font-bold text-rose-700/80 tracking-wider">Explotados</span>
                <span id="popCountDisplay" class="text-xl sm:text-2xl font-extrabold text-slate-800">0</span>
            </div>
            <div class="h-8 w-px bg-rose-300/40"></div>
            <div id="comboContainer" class="text-center transition-transform">
                <span class="block text-[10px] sm:text-xs uppercase font-bold text-amber-700/80 tracking-wider">Combo</span>
                <span id="comboDisplay" class="text-xl sm:text-2xl font-black text-amber-500">x1</span>
            </div>
        </div>
    </header>

    <!-- Floating Combo Indicator Container -->
    <div id="floating-text-container" class="absolute inset-0 z-15 pointer-events-none"></div>

    <!-- Bottom Bar: Volume Control & Reset Button Fixed at Footer -->
    <footer class="fixed bottom-0 left-0 right-0 z-20 w-full pointer-events-auto">
        <div class="glass-panel w-full rounded-t-2xl sm:rounded-t-3xl border-b-0 px-4 py-3 sm:px-8 sm:py-4 flex justify-between items-center max-w-7xl mx-auto shadow-2xl">
            <!-- Music Control Widget (Play/Pause & Volume) -->
            <div class="flex items-center gap-3 max-w-[200px] sm:max-w-md w-full">
                <button id="bgmToggleBtn" class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-rose-500 hover:bg-rose-600 text-white flex items-center justify-center text-base sm:text-lg transition-all shadow-md active:scale-95 flex-shrink-0">
                    <i id="bgmIcon" class="fa-solid fa-music"></i>
                </button>
                <div class="flex-1 min-w-[90px] sm:min-w-[140px]">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] sm:text-xs font-bold text-rose-900 truncate">Música</span>
                        <span id="volumePercent" class="text-[9px] sm:text-[10px] font-bold text-rose-700">50%</span>
                    </div>
                    <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.5" 
                           class="w-full h-1.5 bg-rose-200/60 rounded-lg appearance-none cursor-pointer accent-rose-500">
                </div>
            </div>

            <!-- Reset Score Button -->
            <div class="flex items-center gap-2 sm:gap-3">
                <button id="clearScoreBtn" title="Reiniciar Puntuación" class="bg-white/40 hover:bg-white/60 text-rose-700 font-bold px-4 sm:px-6 h-10 sm:h-12 rounded-xl sm:rounded-2xl flex items-center gap-2 transition-all active:scale-95 shadow-sm text-xs sm:text-sm border border-white/50">
                    <i class="fa-solid fa-rotate-right text-base sm:text-lg"></i>
                    <span>Reiniciar</span>
                </button>
            </div>
        </div>
    </footer>

    <!-- Hidden Audio Element for Background Music -->
    <audio id="bgmAudio" loop class="hidden"></audio>

    <script>
        // =========================================================================
        // DIRECT REPOSITORY URLs (Modify image and music links directly here)
        // =========================================================================
        const GITHUB_BACKGROUND_IMAGE_URL = 'https://github.com/EndersonSivira/Pop-My-Heart/raw/main/IMG_20260920_133239.jpg';
        const GITHUB_BACKGROUND_MUSIC_URL = 'https://github.com/EndersonSivira/Pop-My-Heart/raw/main/wwd.mp3juice.blog%20-%20Good%20Kid%20-%20From%20the%20Start%20(320%20KBps).mp3';

        // Canvas & Context Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State Variables
        let score = 0;
        let popCount = 0;
        let combo = 1;
        let lastPopTime = 0;
        const COMBO_TIMEOUT = 1200; // time in ms to reset combo

        // Shake Motion Detection State
        let lastX = null, lastY = null, lastZ = null;
        let lastShakeTime = 0;
        const SHAKE_THRESHOLD = 18; // Acceleration threshold
        const SHAKE_COOLDOWN = 1200; // Cooldown ms between shake bursts

        // Fixed Physics & Visual Game Settings
        const GAME_CONFIG = {
            spawnRateMs: 700,
            baseSpeed: 2.5,
            heartOpacity: 0.65
        };

        // Game Entities Arrays
        let hearts = [];
        let particles = [];
        let spawnTimer = null;

        // Audio Context for Synthesized Sound Effects
        let audioCtx = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Synthesizes pop sound effect dynamically
        function playPopSound(pitchMultiplier = 1) {
            try {
                initAudioContext();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                const baseFreq = 320 * pitchMultiplier;
                const endFreq = 780 * pitchMultiplier;
                const now = audioCtx.currentTime;

                osc.type = 'sine';
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.08);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.09);
            } catch (e) {
                // Ignore audio errors prior to user interaction
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Render translucent parametric Heart shape
        function drawHeart(ctx, x, y, size, opacity, colorHue, extraGlow = false) {
            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();
            
            const topCurveHeight = size * 0.3;
            ctx.moveTo(0, topCurveHeight);
            
            // Bezier Curves for Heart shape
            ctx.bezierCurveTo(
                -size / 2, -size / 2, 
                -size, topCurveHeight / 2, 
                0, size
            );
            ctx.bezierCurveTo(
                size, topCurveHeight / 2, 
                size / 2, -size / 2, 
                0, topCurveHeight
            );
            
            ctx.closePath();

            // Glassmorphism radial gradient
            const gradient = ctx.createRadialGradient(0, 0, size * 0.1, 0, 0, size);
            gradient.addColorStop(0, `hsla(${colorHue}, 100%, 85%, ${opacity + 0.2})`);
            gradient.addColorStop(0.7, `hsla(${colorHue}, 90%, 65%, ${opacity})`);
            gradient.addColorStop(1, `hsla(${colorHue}, 80%, 50%, ${opacity * 0.7})`);

            ctx.fillStyle = gradient;
            ctx.shadowColor = `hsla(${colorHue}, 100%, 70%, ${extraGlow ? 0.9 : 0.4})`;
            ctx.shadowBlur = extraGlow ? 22 : 10;
            ctx.fill();

            // Highlight border stroke
            ctx.lineWidth = Math.max(1.5, size * 0.05);
            ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.85})`;
            ctx.stroke();

            // Glossy reflection spot
            ctx.beginPath();
            ctx.arc(-size * 0.25, -size * 0.15, size * 0.12, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.75})`;
            ctx.fill();

            ctx.restore();
        }

        class Heart {
            constructor(spawnFromSide = false, side = 'left') {
                this.size = Math.random() * 25 + 25; // Size between 25px and 50px
                this.isSideSpawned = spawnFromSide;
                
                if (spawnFromSide) {
                    // Lateral Spawn (Burst triggered by shake gesture)
                    this.x = side === 'left' ? -this.size : canvas.width + this.size;
                    this.y = Math.random() * (canvas.height * 0.75) + (canvas.height * 0.1);
                    
                    const targetX = side === 'left' 
                        ? (canvas.width * 0.35 + Math.random() * (canvas.width * 0.4)) 
                        : (canvas.width * 0.25 + Math.random() * (canvas.width * 0.4));
                    const targetY = Math.random() * (canvas.height * 0.6);
                    
                    const angle = Math.atan2(targetY - this.y, targetX - this.x);
                    const speed = Math.random() * 5 + 4;
                    
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.speedY = 0;
                    this.colorHue = Math.floor(Math.random() * 25) + 335;
                    this.opacity = Math.min(1, GAME_CONFIG.heartOpacity + 0.25);
                    this.extraGlow = true;
                } else {
                    // Standard Bottom Spawn
                    this.x = Math.random() * (canvas.width - this.size * 2) + this.size;
                    this.y = canvas.height + this.size + Math.random() * 20;
                    this.speedY = (Math.random() * 1.5 + GAME_CONFIG.baseSpeed) * (this.size > 40 ? 0.85 : 1.15);
                    this.vx = 0;
                    this.vy = 0;
                    this.colorHue = Math.floor(Math.random() * 35) + 330;
                    this.opacity = GAME_CONFIG.heartOpacity;
                    this.extraGlow = false;
                }
                
                // Sway & Wobble motion
                this.wobbleSpeed = Math.random() * 0.03 + 0.015;
                this.wobbleAmplitude = Math.random() * 2 + 0.5;
                this.wobbleAngle = Math.random() * Math.PI * 2;
                this.popped = false;
            }

            update() {
                if (this.isSideSpawned) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy -= 0.04; // Curve upwards
                } else {
                    this.y -= this.speedY;
                }
                this.wobbleAngle += this.wobbleSpeed;
                this.x += Math.sin(this.wobbleAngle) * this.wobbleAmplitude;
            }

            draw() {
                drawHeart(ctx, this.x, this.y, this.size, this.opacity, this.colorHue, this.extraGlow);
            }

            containsPoint(px, py) {
                const dx = px - this.x;
                const dy = py - this.y;
                return (dx * dx + dy * dy) <= (this.size * 1.25) * (this.size * 1.25);
            }
        }

        class Particle {
            constructor(x, y, colorHue) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 8 + 4;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.15;
                this.alpha = 1;
                this.decay = Math.random() * 0.025 + 0.02;
                this.colorHue = colorHue;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                drawHeart(ctx, this.x, this.y, this.size, this.alpha, this.colorHue);
                ctx.restore();
            }
        }

        function createExplosion(x, y, colorHue) {
            const count = Math.floor(Math.random() * 6) + 10;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, colorHue));
            }
        }

        function showFloatingText(text, x, y, customClass = "text-rose-500") {
            const container = document.getElementById('floating-text-container');
            const el = document.createElement('div');
            el.className = `absolute font-black text-xl sm:text-2xl pointer-events-none transition-all duration-700 ease-out transform -translate-x-1/2 -translate-y-1/2 ${customClass}`;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.innerText = text;

            container.appendChild(el);

            setTimeout(() => {
                el.style.transform = 'translate(-50%, -100px) scale(1.2)';
                el.style.opacity = '0';
            }, 20);

            setTimeout(() => el.remove(), 700);
        }

        // Trigger burst of hearts emerging from both left and right screen borders on phone shake
        function triggerShakeHeartBurst() {
            const now = Date.now();
            if (now - lastShakeTime < SHAKE_COOLDOWN) return;
            lastShakeTime = now;

            // Haptic Vibration Feedback
            if (navigator.vibrate) {
                navigator.vibrate([80, 40, 100]);
            }

            // Visual Screen Flash Effect
            const overlay = document.getElementById('shakeFlashOverlay');
            overlay.classList.remove('shake-flash');
            void overlay.offsetWidth; // Force reflow
            overlay.classList.add('shake-flash');

            showFloatingText("⚡ ¡SACUDIDA DETECTADA! ⚡", canvas.width / 2, canvas.height / 3, "text-amber-400 text-2xl sm:text-4xl drop-shadow-lg");

            playPopSound(1.6);
            setTimeout(() => playPopSound(2.2), 120);

            // Spawn batch of lateral hearts floating inward from both sides
            const countPerSide = 10;
            for (let i = 0; i < countPerSide; i++) {
                setTimeout(() => {
                    hearts.push(new Heart(true, 'left'));
                    hearts.push(new Heart(true, 'right'));
                }, i * 70);
            }
        }

        // Automatic Device Motion Sensor Registration for Shake Gesture
        function initShakeDetection() {
            if (typeof DeviceMotionEvent !== 'undefined') {
                if (typeof DeviceMotionEvent.requestPermission === 'function') {
                    // iOS DeviceMotion Permission
                    DeviceMotionEvent.requestPermission()
                        .then(response => {
                            if (response === 'granted') {
                                window.addEventListener('devicemotion', handleMotion, false);
                            }
                        })
                        .catch(console.error);
                } else {
                    // Standard DeviceMotion API
                    window.addEventListener('devicemotion', handleMotion, false);
                }
            }
        }

        function handleMotion(e) {
            const acc = e.accelerationIncludingGravity;
            if (!acc) return;

            if (lastX === null) {
                lastX = acc.x;
                lastY = acc.y;
                lastZ = acc.z;
                return;
            }

            const deltaX = Math.abs(acc.x - lastX);
            const deltaY = Math.abs(acc.y - lastY);
            const deltaZ = Math.abs(acc.z - lastZ);

            if (deltaX + deltaY + deltaZ > SHAKE_THRESHOLD) {
                triggerShakeHeartBurst();
            }

            lastX = acc.x;
            lastY = acc.y;
            lastZ = acc.z;
        }

        function popHeartAt(clickX, clickY) {
            const now = Date.now();
            
            for (let i = hearts.length - 1; i >= 0; i--) {
                const heart = hearts[i];
                if (!heart.popped && heart.containsPoint(clickX, clickY)) {
                    heart.popped = true;

                    if (now - lastPopTime < COMBO_TIMEOUT) {
                        combo = Math.min(combo + 1, 10);
                    } else {
                        combo = 1;
                    }
                    lastPopTime = now;

                    popCount++;
                    const pointsGained = 10 * combo;
                    score += pointsGained;

                    playPopSound(1 + (combo * 0.08));
                    createExplosion(heart.x, heart.y, heart.colorHue);

                    if (combo > 2) {
                        showFloatingText(`+${pointsGained} Combo x${combo}!`, clickX, clickY, "text-amber-400");
                    } else {
                        showFloatingText(`+${pointsGained}`, clickX, clickY, "text-rose-400");
                    }

                    hearts.splice(i, 1);
                    updateHUD();
                    return true;
                }
            }
            return false;
        }

        function handlePointerDown(e) {
            initAudioContext();
            initShakeDetection(); // Enable shake sensor on first user touch if needed
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
            
            if (x && y) {
                popHeartAt(x, y);
            }
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handlePointerDown(e);
        }, { passive: false });

        function updateHUD() {
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('popCountDisplay').innerText = popCount;
            
            const comboEl = document.getElementById('comboDisplay');
            const comboContainer = document.getElementById('comboContainer');
            comboEl.innerText = `x${combo}`;

            if (combo > 3) {
                comboContainer.classList.add('combo-active');
            } else {
                comboContainer.classList.remove('combo-active');
            }
        }

        function gameLoop() {
            if (Date.now() - lastPopTime > COMBO_TIMEOUT && combo > 1) {
                combo = 1;
                updateHUD();
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render Floating Hearts
            for (let i = hearts.length - 1; i >= 0; i--) {
                const heart = hearts[i];
                heart.update();
                heart.draw();

                if (heart.y < -heart.size * 2 || heart.x < -heart.size * 3 || heart.x > canvas.width + heart.size * 3) {
                    hearts.splice(i, 1);
                }
            }

            // Render Explosion Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function startSpawning() {
            if (spawnTimer) clearInterval(spawnTimer);
            spawnTimer = setInterval(() => {
                if (hearts.length < 40) {
                    hearts.push(new Heart());
                }
            }, GAME_CONFIG.spawnRateMs);
        }

        const bgmAudio = document.getElementById('bgmAudio');
        const bgmToggleBtn = document.getElementById('bgmToggleBtn');
        const bgmIcon = document.getElementById('bgmIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumePercent = document.getElementById('volumePercent');
        const clearScoreBtn = document.getElementById('clearScoreBtn');

        function setupAudio() {
            bgmAudio.src = GITHUB_BACKGROUND_MUSIC_URL;
            bgmAudio.volume = volumeSlider.value;
            
            bgmToggleBtn.addEventListener('click', () => {
                initAudioContext();
                if (bgmAudio.paused) {
                    bgmAudio.play().then(() => {
                        bgmIcon.className = "fa-solid fa-pause";
                        bgmToggleBtn.classList.replace('bg-rose-500', 'bg-emerald-500');
                    }).catch(err => {
                        console.error("Audio play error:", err);
                    });
                } else {
                    bgmAudio.pause();
                    bgmIcon.className = "fa-solid fa-music";
                    bgmToggleBtn.classList.replace('bg-emerald-500', 'bg-rose-500');
                }
            });

            volumeSlider.addEventListener('input', (e) => {
                const val = e.target.value;
                bgmAudio.volume = val;
                volumePercent.innerText = `${Math.round(val * 100)}%`;
            });
        }

        function setBackgroundImage(url) {
            if (!url) return;
            const bgContainer = document.getElementById('bg-container');
            const img = new Image();
            img.onload = () => {
                bgContainer.style.backgroundImage = `url('${url}')`;
            };
            img.onerror = () => {
                bgContainer.style.backgroundImage = `linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%)`;
            };
            img.src = url;
        }

        // Reset Score Button Listener
        clearScoreBtn.addEventListener('click', () => {
            score = 0;
            popCount = 0;
            combo = 1;
            updateHUD();
        });

        // Window Load Initialization
        window.onload = () => {
            setBackgroundImage(GITHUB_BACKGROUND_IMAGE_URL);
            setupAudio();
            startSpawning();
            gameLoop();
            initShakeDetection();
        };
    </script>
</body>
</html>
